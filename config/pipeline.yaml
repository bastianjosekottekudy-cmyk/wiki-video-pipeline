web:
  host: 127.0.0.1
  port: 8082
formats:
  short:
    width: 1080
    height: 1920
    max_video_duration_sec: 180
    target_duration_sec: 120
    source_chars: 8000
  video:
    width: 1920
    height: 1080
    max_video_duration_sec: 0
    target_duration_sec: 0
    source_chars: 18000
video:
  fps: 24
  format: mp4
  codec: auto
  concat_after_clips: 12
tts:
  provider: chirp3
  gcp_voice: en-US-Chirp3-HD-Fenrir
  backup_voice: en-US-ChristopherNeural
  backup_pitch: -8Hz
  backup_rate: -4%
  segment_pause_sec: 0.4
script:
  provider: chain
  style: documentary host; hook first; surprising true facts; complete spoken sentences;
    never invent; never read citations or URLs
images:
  max_per_article: 8
  skip_fair_use: true
youtube:
  clients:
  - id: primary
    client_secrets: secrets/client_secrets.json
    token: secrets/token.json
  - id: backup1
    client_secrets: secrets/clients/backup1/client_secrets.json
    token: secrets/clients/backup1/token.json
  - id: backup2
    client_secrets: secrets/clients/backup2/client_secrets.json
    token: secrets/clients/backup2/token.json
  enabled: true
  category_id: '27'
  privacy: public
  made_for_kids: false
  license: creativeCommon
  tags:
  - wikipedia
  - education
  - explainer
  - documentary
